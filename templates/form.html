<!DOCTYPE html>
<html>
<head>
    <title>Upload blood smear image</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style_inputpage.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" crossorigin="anonymous">
</head>
<body>
    <img id="logo" src="{{ url_for('static', filename='images/logo.png') }}">
    <h1><span>Input Form</span></h1>
    <h4>Upload the image below!</h4>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning" role="alert">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}
    <form method="post" enctype="multipart/form-data" class="mt-4">
        <div class="form-group text-center">
            <input id="imageBtn" type="file" name="file" class="form-control-file" accept=".png,.jpg,.jpeg" required>
        </div>
        <div class="text-center">
            <button type="submit" class="btn btn-success">Submit</button>
            <a href="{{ url_for('index') }}" class="btn btn-link">Back to home</a>
        </div>
    </form>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
